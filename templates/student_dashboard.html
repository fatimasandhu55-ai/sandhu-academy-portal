{% extends "base.html" %}
{% block content %}
<div style="padding:20px;max-width:600px;margin:auto">
<div style="background:white;padding:20px;border-radius:20px;text-align:center;box-shadow:0 2px 10px #ddd">
<!-- BACHA APNI PIC YAHAN DEKHEGA -->
{% if me|length>9 and me[9] %}<img src="/static/uploads/{{me[9]}}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #ff2e88">{% else %}<div style="width:120px;height:120px;border-radius:50%;background:#ffe0ec;display:flex;align-items:center;justify-content:center;font-size:50px;margin:auto">👦</div>{% endif %}
<h2>{{me[1]}}</h2>
<p>Class: {{me[5]}} | Marks: {{me[7]}}</p>
<!-- PIC LAGANE WALA FORM -->
<form action="/student_pic" method="POST" enctype="multipart/form-data" style="background:#fff5f8;padding:15px;border-radius:15px">
<p><b>📸 Apni Profile Pic Lagao:</b></p>
<input type="file" name="pic" required><br><br>
<button style="background:#ff2e88;color:white;padding:10px 25px;border:none;border-radius:10px;font-weight:700">✅ Pic Lagao</button>
</form>
<p style="margin-top:15px"><b>Meet Link:</b><br>{{me[8]}}</p>
</div>
</div>
{% endblock %}
